name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-verified.txt
      - name: Install verified dependency versions
        run: python -m pip install -r requirements.txt -c constraints-verified.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run service, model, experiment and UI tests
        run: python -m pytest -q
      - name: Verify source and evidence archive
        run: python scripts/package.py
