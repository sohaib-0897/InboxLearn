[browser]
gatherUsageStats = false

[server]
headless = true
address = "127.0.0.1"

# Newsprint native-widget tokens. Companion stylesheet: assets/newsprint.css.
[theme]
base = "light"
primaryColor = "#9C3B1B"
backgroundColor = "#F3EFE7"
secondaryBackgroundColor = "#F6F2E9"
textColor = "#201D19"
borderColor = "#D4CABB"
dataframeBorderColor = "#D4CABB"
dataframeHeaderBackgroundColor = "#EEE7DC"
showWidgetBorder = false
showSidebarBorder = true
baseRadius = "small"
buttonRadius = "small"
font = "sans-serif"
headingFont = "Georgia, serif"
codeFont = "monospace"
baseFontSize = 16
headingFontSizes = ["3rem", "2rem", "1.5rem", "1.25rem", "1rem", "1rem"]
linkColor = "#87391F"
linkUnderline = false
redColor = "#9C3B1B"
redTextColor = "#79361F"
redBackgroundColor = "#FBF1EC"
greenColor = "#557447"
greenTextColor = "#35492D"
greenBackgroundColor = "#EEF1E9"
blueColor = "#625B52"
blueTextColor = "#514A42"
blueBackgroundColor = "#EEE7DC"
yellowColor = "#A66A2C"
yellowTextColor = "#704616"
yellowBackgroundColor = "#F6EFDF"
chartCategoricalColors = ["#9C3B1B", "#71695E", "#557447"]
chartSequentialColors = ["#F3EFE7", "#F3EFE7", "#EEE7DC", "#EEE7DC", "#D4CABB", "#D4CABB", "#A99A86", "#71695E", "#493F34", "#201D19"]
